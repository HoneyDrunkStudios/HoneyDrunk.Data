# SonarQube Cloud project configuration for HoneyDrunk.Data.
# Project imported via the SonarQube Cloud GitHub App; quality gate runs in
# job-sonarcloud.yml (HoneyDrunk.Actions) on every PR and push to main.
#
# This file lives at HoneyDrunk.Data/sonar-project.properties (inside the
# inner project subdir, next to HoneyDrunk.Data.slnx). All sonar.sources /
# sonar.tests paths are relative to this subdir, which matches the
# working-directory the reusable job-sonarcloud.yml runs from.

sonar.organization=honeydrunkstudios
sonar.projectKey=honeydrunkstudios_HoneyDrunk.Data
sonar.projectName=HoneyDrunk.Data

# Sources — runtime + Abstractions + integrations + Outbox family
sonar.sources=HoneyDrunk.Data,HoneyDrunk.Data.Abstractions,HoneyDrunk.Data.AspNetCore,HoneyDrunk.Data.EntityFramework,HoneyDrunk.Data.Migrations,HoneyDrunk.Data.Outbox,HoneyDrunk.Data.Outbox.Abstractions,HoneyDrunk.Data.Outbox.Dispatcher,HoneyDrunk.Data.SqlServer

# Tests — main test project + Canary cross-Node + Testing helpers
sonar.tests=HoneyDrunk.Data.Tests,HoneyDrunk.Data.Canary,HoneyDrunk.Data.Testing

# Coverage (consumed by job-sonarcloud.yml after Cobertura → OpenCover conversion)
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml

# Exclusions — generated code, build outputs, EF migrations
sonar.exclusions=**/obj/**,**/bin/**,**/*.Designer.cs,**/HoneyDrunk.Data.Migrations/**/*.cs

# Coverage exclusions — Abstractions packages contain interfaces only;
# Migrations are scaffolded EF code; Testing is helper fixtures
sonar.coverage.exclusions=**/HoneyDrunk.Data.Abstractions/**,**/HoneyDrunk.Data.Outbox.Abstractions/**,**/HoneyDrunk.Data.Migrations/**,**/HoneyDrunk.Data.Testing/**

# New Code definition — inherits from organization default (30 days)
